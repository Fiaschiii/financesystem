<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2e6b4b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Controle Financeiro</title>
    <script>
      // Aplica o tema e o idioma escolhidos em Minha conta ANTES de desenhar a
      // página, para não "piscar" branco ao abrir no tema escuro.
      try {
        var tema = localStorage.getItem('tema')
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema
        if (localStorage.getItem('idioma') === 'en') document.documentElement.lang = 'en'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
